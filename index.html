<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飲料點單管理器</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="window">
  <div class="titlebar">
    <div class="dots">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>
    <div class="title-text">訂飲料清單</div>
    <div class="title-actions" data-no-capture="true">
      <button class="capture-btn" id="capture-btn" onclick="downloadPng()">下載 PNG</button>
      <button class="reset-btn" id="reset-btn" type="button" onclick="resetAll()" title="清除今天所有點單狀態" aria-label="重置今日點單狀態"><span class="reset-icon" aria-hidden="true">↻</span><span class="reset-label">重置今日</span></button>
    </div>
  </div>

  <div class="content">
    <div class="status-text" id="status"></div>

    <!-- 圖例 -->
    <div class="legend">
      <div class="legend-item"><div class="legend-dot l-done"></div> 已點單</div>
      <div class="legend-item"><div class="legend-dot l-skip"></div> 不點</div>
      <div class="legend-item"><div class="legend-dot l-leave"></div> 休假</div>
      <div class="legend-hint">點擊循環切換狀態</div>
    </div>

    <div class="progress-wrap">
      <div class="progress-header">
        <div class="progress-label">已點單</div>
        <div class="progress-count" id="count">0<span id="count-sub"> / 27 人</span></div>
      </div>
      <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
    </div>

    <div class="pending" id="pending"></div>
    <div id="root"></div>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
